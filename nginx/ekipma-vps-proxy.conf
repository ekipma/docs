# Host nginx configuration.
# SSL terminates here. Docker nginx is HTTP-only on 127.0.0.1:18080.

server {
    listen 80;
    server_name api.ekipma.ir uploads.ekipma.ir cdn.ekipma.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.ekipma.ir uploads.ekipma.ir cdn.ekipma.ir;

    ssl_certificate /etc/letsencrypt/live/ekipma.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ekipma.ir/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
